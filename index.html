<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TSC-Claude</title>

  <link rel="stylesheet" href="https://use.typekit.net/ikf0hkb.css">

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /*
      Typefaces — all from ikf0hkb kit:
      ─────────────────────────────────────────────────────────
      ff-meta-web-pro-condensed    UI chrome, labels, exchange
                                   numbers — tall narrow caps
                                   read like gauge markings
      ff-meta-correspondence-web-p Your prompts — the typewriter
                                   variant of Meta, keyed dispatch
      ff-meta-web-pro              Claude responses — the classic
                                   humanist Meta, built to read
    */

    :root {
      --cream:     #F5F0E8;
      --parchment: #EDE7D9;
      --ink:       #1C1A16;
      --ink-warm:  #2E1A0E;
      --muted:     #8A8178;
      --rule:      #C8BFB0;
      --rule-lt:   #DDD8CE;
      --accent:    #8B4513;
      --accent-bg: rgba(139,69,19,.07);

      --f-ui:     "ff-meta-web-pro-condensed", sans-serif;
      --f-prompt: "ff-meta-correspondence-web-p", sans-serif;
      --f-reply:  "warnock-pro", serif;

      --pad: 28px;
      --gap: 34px;
      --q:   37%;
      --r:   63%;
    }

    html, body { height: 100%; background: var(--cream); }
    #root       { height: 100%; }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      color: var(--ink);
    }

    /* ── Header ─────────────────────────────────── */
    .hd {
      display: grid;
      grid-template-columns: var(--q) var(--r);
      background: var(--parchment);
      border-bottom: 1px solid var(--rule);
      flex-shrink: 0;
    }
    .hd-q {
      padding: 14px var(--gap) 13px var(--pad);
      border-right: 1px solid var(--rule);
      display: flex;
      align-items: baseline;
      gap: 16px;
    }
    .hd-r {
      padding: 14px var(--pad) 13px var(--gap);
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }
    .col-lbl {
      font-family: var(--f-ui);
      font-weight: 700;
      font-size: 10.5px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
      line-height: 1;
    }
    .hd-controls { display: flex; align-items: baseline; gap: 16px; }
    .model-tag {
      font-family: var(--f-ui);
      font-weight: 400;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      border: 1px solid var(--rule);
      padding: 3px 9px 2px;
    }

    /* ── API key ─────────────────────────────────── */
    .key-bar {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px var(--pad);
      background: var(--parchment);
      border-bottom: 1px solid var(--rule);
      flex-shrink: 0;
    }
    .key-lbl {
      font-family: var(--f-ui);
      font-weight: 700;
      font-size: 10px;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
    }
    .key-input {
      flex: 1;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--rule);
      outline: none;
      font-family: var(--f-prompt);
      font-size: 16px;
      color: var(--ink);
      padding: 3px 4px;
    }
    .key-input::placeholder { color: var(--rule); }
    .key-btn {
      background: none;
      border: 1px solid var(--rule);
      color: var(--muted);
      font-family: var(--f-ui);
      font-weight: 700;
      font-size: 10px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      padding: 5px 14px 4px;
      cursor: pointer;
      transition: all .15s;
    }
    .key-btn:hover { border-color: var(--accent); color: var(--accent); }

    .key-active {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px var(--pad);
      background: var(--parchment);
      border-bottom: 1px solid var(--rule);
      flex-shrink: 0;
    }
    .key-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 6px rgba(139,69,19,.4);
      animation: glow 3s ease-in-out infinite;
    }
    @keyframes glow { 0%,100%{opacity:1} 50%{opacity:.3} }
    .key-active-lbl {
      font-family: var(--f-ui);
      font-weight: 700;
      font-size: 9.5px;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .key-clear {
      margin-left: auto;
      background: none; border: none;
      font-family: var(--f-ui);
      font-weight: 400;
      font-size: 9.5px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      cursor: pointer;
      transition: color .15s;
    }
    .key-clear:hover { color: var(--accent); }

    /* ── Scroll ──────────────────────────────────── */
    .scroll {
      flex: 1;
      overflow-y: auto;
      scroll-behavior: smooth;
      background: var(--cream);
    }
    .scroll::-webkit-scrollbar { width: 3px; }
    .scroll::-webkit-scrollbar-track { background: transparent; }
    .scroll::-webkit-scrollbar-thumb { background: var(--rule); }

    /* ── Empty ───────────────────────────────────── */
    .empty {
      display: grid;
      grid-template-columns: var(--q) var(--r);
      height: 100%;
      min-height: 180px;
    }
    .empty-col { padding: 52px var(--pad); }
    .empty-col:first-child {
      padding-right: var(--gap);
      border-right: 1px solid var(--rule-lt);
    }
    .empty-col:last-child { padding-left: var(--gap); }
    .empty-rule { width: 22px; height: 1px; background: var(--rule); margin-bottom: 18px; }
    .empty-txt {
      font-family: var(--f-reply);
      font-size: 20px;
      font-style: italic;
      color: var(--muted);
      line-height: 1.65;
    }

    /* ── Exchange ────────────────────────────────── */
    .exchange {
      display: grid;
      grid-template-columns: var(--q) var(--r);
      border-bottom: 1px solid var(--rule-lt);
      animation: rise .2s ease forwards;
      opacity: 0;
    }
    @keyframes rise {
      from { opacity:0; transform:translateY(4px); }
      to   { opacity:1; transform:translateY(0); }
    }

    .ex-q {
      padding: 28px var(--gap) 28px var(--pad);
      border-right: 1px solid var(--rule);
    }
    .ex-num {
      display: block;
      font-family: var(--f-ui);
      font-weight: 700;
      font-size: 9px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--rule);
      margin-bottom: 11px;
    }
    .query-text {
      font-family: var(--f-prompt);
      font-size: 20px;
      font-weight: 400;
      line-height: 1.65;
      color: var(--ink-warm);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .ex-r { padding: 28px var(--pad) 28px var(--gap); }

    .resp {
      font-family: var(--f-reply);
      font-size: 20px;
      font-weight: 400;
      line-height: 1.74;
      color: var(--ink);
      word-break: break-word;
    }
    .resp p            { margin-bottom: .85em; }
    .resp p:last-child { margin-bottom: 0; }
    .resp strong       { font-weight: 700; color: var(--ink-warm); }
    .resp em           { font-style: italic; }

    .resp h1,.resp h2,.resp h3 {
      font-family: var(--f-ui);
      font-weight: 700;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--ink);
      margin: 1.2em 0 .4em;
      line-height: 1.15;
    }
    .resp h1 { font-size: 24px; }
    .resp h2 { font-size: 19px; }
    .resp h3 { font-size: 14px; letter-spacing: .26em; }

    .resp ul,.resp ol { padding-left: 20px; margin-bottom: .85em; }
    .resp li          { margin-bottom: .28em; }

    .resp code {
      font-family: var(--f-prompt);
      font-size: 17px;
      background: var(--parchment);
      border: 1px solid var(--rule-lt);
      padding: 1px 5px;
      color: var(--accent);
    }
    .resp pre {
      background: var(--ink);
      color: #C8C0B0;
      padding: 18px 20px;
      margin: 14px 0;
      overflow-x: auto;
      font-family: var(--f-prompt);
      font-size: 16px;
      line-height: 1.65;
    }
    .resp pre code {
      background:none; border:none; padding:0;
      color:inherit; font-size:inherit;
    }
    .resp blockquote {
      border-left: 2px solid var(--rule);
      padding-left: 16px;
      color: var(--muted);
      font-style: italic;
      margin: .85em 0;
    }
    .resp hr { border:none; border-top:1px solid var(--rule-lt); margin:18px 0; }
    .err-txt {
      font-family: var(--f-reply);
      font-size: 19px;
      font-style: italic;
      color: var(--accent);
    }

    /* ── Thinking ────────────────────────────────── */
    .thinking {
      display: grid;
      grid-template-columns: var(--q) var(--r);
      animation: rise .2s ease forwards;
      opacity: 0;
    }
    .thinking-q {
      padding: 28px var(--gap) 28px var(--pad);
      border-right: 1px solid var(--rule);
    }
    .thinking-r {
      padding: 36px var(--pad) 28px var(--gap);
      display: flex; align-items: flex-start; gap: 6px;
    }
    .dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--rule);
      animation: blink 1.3s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: .2s; }
    .dot:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%,80%,100%{opacity:.22} 40%{opacity:1} }

    /* ── Input ───────────────────────────────────── */
    .input-wrap {
      border-top: 1px solid var(--rule);
      background: var(--parchment);
      flex-shrink: 0;
    }
    .input-grid {
      display: grid;
      grid-template-columns: var(--q) var(--r);
    }
    .input-left {
      padding: 16px var(--gap) 16px var(--pad);
      border-right: 1px solid var(--rule);
      display: flex; flex-direction: column; gap: 8px;
    }
    .input-col-lbl {
      font-family: var(--f-ui);
      font-weight: 700;
      font-size: 10px;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .input-field {
      width: 100%;
      background: transparent;
      border: none; outline: none;
      font-family: var(--f-prompt);
      font-size: 20px;
      font-weight: 400;
      color: var(--ink-warm);
      resize: none;
      line-height: 1.55;
      min-height: 30px;
      max-height: 160px;
      caret-color: var(--accent);
    }
    .input-field::placeholder { color: var(--rule); }
    .input-field:disabled      { opacity: .3; }

    .input-right {
      padding: 16px var(--pad) 16px var(--gap);
      display: flex; align-items: flex-end;
      justify-content: space-between; gap: 16px;
    }
    .input-hint {
      font-family: var(--f-ui);
      font-weight: 400;
      font-size: 10px;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--muted);
      line-height: 1.9;
    }
    .btn-row { display: flex; align-items: center; gap: 14px; }
    .clear-btn {
      background: none; border: none;
      font-family: var(--f-ui);
      font-weight: 700;
      font-size: 10px;
      letter-spacing: .24em;
      text-transform: uppercase;
      color: var(--muted);
      cursor: pointer;
      transition: color .15s;
    }
    .clear-btn:hover { color: var(--accent); }
    .send-btn {
      background: none;
      border: 1px solid var(--rule);
      color: var(--muted);
      font-family: var(--f-ui);
      font-weight: 700;
      font-size: 12px;
      letter-spacing: .28em;
      text-transform: uppercase;
      padding: 8px 20px 7px;
      cursor: pointer;
      transition: all .15s;
      white-space: nowrap;
    }
    .send-btn:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-bg);
    }
    .send-btn:disabled { opacity: .25; cursor: not-allowed; }

    /* ── Footer ──────────────────────────────────── */
    .footer {
      padding: 7px var(--pad) 10px;
      display: flex; justify-content: space-between;
      background: var(--parchment);
      border-top: 1px solid var(--rule-lt);
    }
    .footer-note {
      font-family: var(--f-ui);
      font-weight: 400;
      font-size: 9.5px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--muted);
      opacity: .55;
    }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
  const { useState, useRef, useEffect } = React;

  function renderMd(raw) {
    if (!raw) return "";
    let s = raw
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    s = s.replace(/```[\w]*\n?([\s\S]*?)```/g,(_,c)=>`<pre><code>${c.trim()}</code></pre>`);
    s = s.replace(/`([^`\n]+)`/g,"<code>$1</code>");
    s = s.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
    s = s.replace(/(?<!\*)\*(?!\*)(.+?)(?<!\*)\*(?!\*)/g,"<em>$1</em>");
    s = s.replace(/^&gt;\s?(.+)$/gm,"<blockquote>$1</blockquote>");
    s = s.replace(/^---$/gm,"<hr/>");
    s = s.replace(/^### (.+)$/gm,"<h3>$1</h3>");
    s = s.replace(/^## (.+)$/gm, "<h2>$1</h2>");
    s = s.replace(/^# (.+)$/gm,  "<h1>$1</h1>");
    s = s.replace(/^\s*[-*]\s+(.+)$/gm,"<li>$1</li>");
    s = s.replace(/^\s*\d+\.\s+(.+)$/gm,"<li>$1</li>");
    s = s.replace(/(<li>[\s\S]*?<\/li>)(\n<li>[\s\S]*?<\/li>)*/g,m=>`<ul>${m}</ul>`);
    s = s.split(/\n{2,}/).map(b=>{
      const t=b.trim();
      if(/^<(h[123]|ul|ol|li|pre|blockquote|hr)/.test(t)) return t;
      if(!t) return "";
      return `<p>${t.replace(/\n/g," ")}</p>`;
    }).join("\n");
    return s;
  }

  function App() {
    const [apiKey,   setApiKey]   = useState(()=>sessionStorage.getItem("ck")||"");
    const [keyDraft, setKeyDraft] = useState("");
    const [keySet,   setKeySet]   = useState(()=>!!sessionStorage.getItem("ck"));
    const [pairs,    setPairs]    = useState([]);
    const [draft,    setDraft]    = useState("");
    const [loading,  setLoading]  = useState(false);
    const [pendingQ, setPendingQ] = useState("");
    const bottomRef = useRef(null);
    const taRef     = useRef(null);

    useEffect(()=>{
      bottomRef.current?.scrollIntoView({behavior:"smooth"});
    },[pairs,loading]);

    const resize = el => {
      el.style.height = "auto";
      el.style.height = Math.min(el.scrollHeight,160)+"px";
    };

    const saveKey = () => {
      const k = keyDraft.trim();
      if (!k) return;
      sessionStorage.setItem("ck",k);
      setApiKey(k); setKeySet(true); setKeyDraft("");
    };
    const clearKey = () => {
      sessionStorage.removeItem("ck");
      setApiKey(""); setKeySet(false);
    };

    const buildHistory = () => {
      const m = [];
      pairs.forEach(p=>{
        m.push({role:"user",      content:p.query});
        m.push({role:"assistant", content:p.response||" "});
      });
      return m;
    };

    const send = async () => {
      const q = draft.trim();
      if (!q||loading||!apiKey) return;
      setDraft(""); setPendingQ(q); setLoading(true);
      if (taRef.current) taRef.current.style.height="auto";
      try {
        const res = await fetch("https://api.anthropic.com/v1/messages",{
          method:"POST",
          headers:{
            "Content-Type":"application/json",
            "x-api-key":apiKey,
            "anthropic-version":"2023-06-01",
            "anthropic-dangerous-direct-browser-access":"true"
          },
          body:JSON.stringify({
            model:"claude-sonnet-4-20250514",
            max_tokens:1024,
            messages:[...buildHistory(),{role:"user",content:q}]
          })
        });
        if (!res.ok) {
          const e = await res.json().catch(()=>({}));
          throw new Error(e.error?.message||`HTTP ${res.status}`);
        }
        const data  = await res.json();
        const reply = data.content?.find(b=>b.type==="text")?.text||"";
        setPairs(prev=>[...prev,{query:q,response:reply,error:null}]);
      } catch(e) {
        setPairs(prev=>[...prev,{query:q,response:"",error:e.message}]);
      } finally { setLoading(false); setPendingQ(""); }
    };

    const onKey = e => {
      if (e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); send(); }
    };

    return (
      <div className="app">

        <header className="hd">
          <div className="hd-q">
            <span className="col-lbl">TSC-Claude</span>
          </div>
          <div className="hd-r">
            <span className="col-lbl">Response</span>
            <div className="hd-controls">
              {pairs.length>0 &&
                <button className="clear-btn" onClick={()=>setPairs([])}>Clear</button>}
              <span className="model-tag">TSC-Claude · Sonnet 4</span>
            </div>
          </div>
        </header>

        {!keySet ? (
          <div className="key-bar">
            <span className="key-lbl">API Key</span>
            <input
              className="key-input"
              type="password"
              placeholder="sk-ant-…"
              value={keyDraft}
              onChange={e=>setKeyDraft(e.target.value)}
              onKeyDown={e=>e.key==="Enter"&&saveKey()}
            />
            <button className="key-btn" onClick={saveKey}>Confirm</button>
          </div>
        ) : (
          <div className="key-active">
            <div className="key-dot"/>
            <span className="key-active-lbl">Connection active · API key stored</span>
            <button className="key-clear" onClick={clearKey}>Remove</button>
          </div>
        )}

        <div className="scroll">
          {pairs.length===0&&!loading&&(
            <div className="empty">
              <div className="empty-col">
                <div className="empty-rule"/>
                <p className="empty-txt">Your questions<br/>appear here.</p>
              </div>
              <div className="empty-col">
                <div className="empty-rule"/>
                <p className="empty-txt">Responses appear<br/>alongside each inquiry.</p>
              </div>
            </div>
          )}

          {pairs.map((p,i)=>(
            <div key={i} className="exchange">
              <div className="ex-q">
                <span className="ex-num">— {String(i+1).padStart(2,"0")} —</span>
                <p className="query-text">{p.query}</p>
              </div>
              <div className="ex-r">
                {p.error
                  ? <p className="err-txt">⚠ {p.error}</p>
                  : <div className="resp"
                         dangerouslySetInnerHTML={{__html:renderMd(p.response)}}/>
                }
              </div>
            </div>
          ))}

          {loading&&(
            <div className="thinking">
              <div className="thinking-q">
                <span className="ex-num">— {String(pairs.length+1).padStart(2,"0")} —</span>
                <p className="query-text">{pendingQ}</p>
              </div>
              <div className="thinking-r">
                <div className="dot"/><div className="dot"/><div className="dot"/>
              </div>
            </div>
          )}
          <div ref={bottomRef}/>
        </div>

        <div className="input-wrap">
          <div className="input-grid">
            <div className="input-left">
              <span className="input-col-lbl">Inquiry</span>
              <textarea
                ref={taRef}
                className="input-field"
                value={draft}
                placeholder={keySet?"Type your question…":"Enter API key above"}
                rows={1}
                disabled={!keySet}
                onChange={e=>{setDraft(e.target.value);resize(e.target);}}
                onKeyDown={onKey}
              />
            </div>
            <div className="input-right">
              <span className="input-hint">
                Enter · Send<br/>
                Shift+Enter · New line
              </span>
              <div className="btn-row">
                <button
                  className="send-btn"
                  onClick={send}
                  disabled={!draft.trim()||loading||!keySet}
                >
                  Send
                </button>
              </div>
            </div>
          </div>
        </div>

        <div className="footer">
          <span className="footer-note">TSC-Claude · Sonnet 4 · Anthropic API</span>
          <span className="footer-note">Session only · Key not stored to disk</span>
        </div>

      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
